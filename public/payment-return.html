<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem("mds_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment status — Meowji Official</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Manrope','ui-sans-serif','system-ui','sans-serif'] }, colors: { brand: { 50: '#2b1c0d', 100: '#3a2410', 200: '#4a2f14', 500: '#f97316', 600: '#ea580c', 700: '#c2410c', 800: '#9a3412', 900: '#7c2d12' } } } } };</script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="text-gray-100 antialiased">
<body class="antialiased">
<!-- Loading screen -->
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<div id="navbar"></div>

<main class="max-w-xl mx-auto px-4 py-16">
  <div id="status-wrap" class="mg-panel p-8 sm:p-12 text-center">
    <div class="w-16 h-16 mx-auto rounded-full bg-[#1b2338] flex items-center justify-center">
      <svg class="w-8 h-8 text-gray-400 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path></svg>
    </div>
    <h1 class="text-2xl font-extrabold tracking-tight mt-4">Confirming your payment…</h1>
    <p class="text-gray-500 mt-1 text-sm">Please wait while we verify with the payment gateway.</p>
  </div>
</main>

<div id="footer"></div>

<script src="/js/app.js"></script>
<script>
(function () {
  const wrap = document.getElementById('status-wrap');
  const oid = new URLSearchParams(location.search).get('oid');

  function done(html) { wrap.innerHTML = html; document.title = 'Payment status — Meowji Official'; }

  function renderSuccess(o) {
    done(`
      <div class="w-16 h-16 mx-auto rounded-full bg-[#e8f0fe] text-[#c2410c] flex items-center justify-center">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight mt-4">Payment successful</h1>
      <p class="text-gray-500 mt-1">Order <span class="font-bold text-gray-100">#${esc(oid)}</span> is confirmed.${o.utr ? ` UTR: <span class="font-mono text-sm">${esc(o.utr)}</span>` : ''}</p>
      <p class="text-sm text-gray-500 mt-3">Your subscription will be delivered shortly. You can track it below.</p>
      <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
        <a href="/order.html?id=${encodeURIComponent(oid)}" class="mg-btn-gold">View my order</a>
        <a href="/" class="mg-btn-cream">Continue shopping</a>
      </div>`);
  }

  function renderPending(msg) {
    done(`
      <div class="w-16 h-16 mx-auto rounded-full bg-[#e8f0fe] text-[#c2410c] flex items-center justify-center">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2"/></svg>
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight mt-4">Payment not confirmed yet</h1>
      <p class="text-gray-500 mt-1 text-sm">${esc(msg || 'The gateway has not confirmed this payment yet. If you completed the payment, wait a minute and check again.')}</p>
      <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
        <button id="btn-retry" class="mg-btn-gold">Check again</button>
        <a href="/order.html?id=${encodeURIComponent(oid)}" class="mg-btn-cream text-center">Back to order</a>
      </div>`);
    document.getElementById('btn-retry').addEventListener('click', () => location.reload());
  }

  function renderFailed(msg) {
    done(`
      <div class="w-16 h-16 mx-auto rounded-full bg-red-100 text-red-600 flex items-center justify-center">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight mt-4">Payment failed</h1>
      <p class="text-gray-500 mt-1 text-sm">${esc(msg || 'The payment did not go through. No money was taken for this order.')}</p>
      <div class="mt-8">
        <a href="/order.html?id=${encodeURIComponent(oid)}" class="mg-btn-gold inline-flex">Try again</a>
      </div>`);
  }

  async function check() {
    try {
      const o = await api('/api/payments/xtra/status?order_id=' + encodeURIComponent(oid));
      if (o.status === 'paid' || o.status === 'delivered' || o.gateway === 'COMPLETED') return renderSuccess(o);
      if (o.gateway === 'FAILED') return renderFailed(o.message);
      return renderPending(o.message);
    } catch (e) {
      return renderPending((e && e.data && e.data.error) || null);
    }
  }

  async function init() {
    await boot();
    if (!requireLogin()) return;
    if (!oid) {
      done(`<p class="text-gray-500 py-16">Order not found. <a href="/account.html" class="text-[#c2410c] font-semibold">My orders</a></p>`);
      return;
    }
    // Poll a few times — the gateway can take a moment to settle.
    for (let i = 0; i < 4; i++) {
      try {
        const o = await api('/api/payments/xtra/status?order_id=' + encodeURIComponent(oid));
        if (o.status === 'paid' || o.status === 'delivered' || o.gateway === 'COMPLETED') return renderSuccess(o);
        if (o.gateway === 'FAILED') return renderFailed(o.message);
      } catch (_) { /* keep polling */ }
      await new Promise((r) => setTimeout(r, 4000));
    }
    check();
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
<script>
(function(){var h=function(){var l=document.getElementById('page-loader');if(l){l.style.opacity='0';setTimeout(function(){l.remove()},400)}};window.addEventListener('load',function(){setTimeout(h,300)});setTimeout(h,5000);})();
</script>
</body>
</html>
