<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f3f4f6; color: #111827; }
  .toolbar { max-width: 820px; margin: 0 auto; padding: 20px 16px 0; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
  .toolbar a { color: #1d4ed8; font-weight: 600; text-decoration: none; font-size: 14px; }
  .btn { background: #f97316; color: #fff; border: 0; border-radius: 12px; padding: 12px 24px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn:hover { background: #ea580c; }
  .page { max-width: 820px; margin: 20px auto 40px; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); overflow: hidden; }
  .inv-head { padding: 36px 40px 28px; border-bottom: 3px solid #f97316; display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .seller h1 { font-size: 26px; font-weight: 800; }
  .seller p { font-size: 13px; color: #6b7280; margin-top: 6px; line-height: 1.6; }
  .meta { text-align: right; }
  .meta .inv-title { font-size: 30px; font-weight: 800; letter-spacing: 2px; color: #f97316; }
  .meta table { margin-top: 10px; font-size: 13px; }
  .meta td { padding: 3px 0; }
  .meta td:first-child { color: #6b7280; padding-right: 12px; }
  .meta td:last-child { font-weight: 600; text-align: right; }
  .parties { display: flex; gap: 24px; padding: 24px 40px; flex-wrap: wrap; }
  .party { flex: 1; min-width: 220px; }
  .party h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #9ca3af; margin-bottom: 8px; }
  .party p { font-size: 14px; line-height: 1.7; }
  .party .name { font-weight: 700; font-size: 15px; }
  table.items { width: 100%; border-collapse: collapse; margin: 8px 0 0; }
  table.items th { background: #f9fafb; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #6b7280; padding: 12px 40px 12px 0; }
  table.items th:first-child { padding-left: 40px; }
  table.items td { padding: 14px 40px 14px 0; border-top: 1px solid #f3f4f6; font-size: 14px; vertical-align: top; }
  table.items td:first-child { padding-left: 40px; }
  table.items td.num, table.items th.num { text-align: right; }
  .variant { color: #6b7280; font-size: 12px; }
  .totals { padding: 20px 40px 8px; display: flex; justify-content: flex-end; }
  .totals table { min-width: 280px; font-size: 14px; }
  .totals td { padding: 5px 0; }
  .totals td:last-child { text-align: right; font-weight: 600; }
  .totals tr.grand td { font-size: 18px; font-weight: 800; border-top: 2px solid #111827; padding-top: 10px; }
  .totals .disc { color: #059669; }
  .notes { padding: 16px 40px 36px; font-size: 13px; color: #6b7280; line-height: 1.7; }
  .notes .receipt-note { margin-top: 10px; font-size: 12px; color: #9ca3af; }
  .error { max-width: 820px; margin: 60px auto; text-align: center; color: #6b7280; font-size: 15px; padding: 0 16px; }
  .spinner { text-align: center; padding: 80px 0; color: #9ca3af; }
  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .page { box-shadow: none; border-radius: 0; margin: 0; max-width: none; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <a href="#" id="back-link">← Back to order</a>
  <button class="btn" onclick="window.print()">Print / Save as PDF</button>
</div>
<div id="root"><div class="spinner">Loading invoice…</div></div>
<script>
(function () {
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const params = new URLSearchParams(location.search);
  const orderId = params.get('order');
  const root = document.getElementById('root');
  document.getElementById('back-link').href = orderId ? '/order.html?id=' + encodeURIComponent(orderId) : '/account.html';
  if (!orderId) { root.innerHTML = '<div class="error">No order specified.</div>'; return; }

  const money = (n, cur) => {
    n = Number(n) || 0;
    return cur === 'USD' ? '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '₹' + n.toLocaleString('en-IN');
  };
  const fmtDate = (d) => { try { return new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return ''; } };

  fetch('/api/invoices/' + encodeURIComponent(orderId), { credentials: 'same-origin' })
    .then(async (r) => {
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || 'Could not load invoice.'); }
      return r.json();
    })
    .then((inv) => {
      document.title = 'Invoice ' + inv.invoice_no;
      const s = inv.seller || {};
      const sellerLines = [s.address, [s.phone, s.email].filter(Boolean).join(' · ')].filter(Boolean);
      root.innerHTML = `
      <div class="page">
        <div class="inv-head">
          <div class="seller">
            <h1>${esc(s.name)}</h1>
            ${sellerLines.map((l) => `<p>${esc(l)}</p>`).join('')}
          </div>
          <div class="meta">
            <div class="inv-title">INVOICE</div>
            <table>
              <tr><td>Invoice no.</td><td>${esc(inv.invoice_no)}</td></tr>
              <tr><td>Issued</td><td>${fmtDate(inv.issued_at)}</td></tr>
              <tr><td>Order</td><td>#${esc(inv.order_id)} · ${fmtDate(inv.order_date)}</td></tr>
              <tr><td>Status</td><td style="text-transform:capitalize">${esc(inv.status)}</td></tr>
            </table>
          </div>
        </div>
        <div class="parties">
          <div class="party">
            <h3>Billed to</h3>
            <p class="name">${esc(inv.buyer.name)}</p>
            <p>${esc(inv.buyer.email)}</p>
          </div>
          <div class="party">
            <h3>From</h3>
            <p class="name">${esc(s.name)}</p>
            ${sellerLines.map((l) => `<p>${esc(l)}</p>`).join('')}
          </div>
        </div>
        <table class="items">
          <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Amount</th></tr></thead>
          <tbody>
            ${(inv.items || []).map((it) => `
              <tr>
                <td><div style="font-weight:600">${esc(it.name)}</div>${it.variant ? `<div class="variant">${esc(it.variant)}</div>` : ''}</td>
                <td class="num">${esc(it.qty)}</td>
                <td class="num">${money(it.unit_price, inv.currency)}</td>
                <td class="num">${money(it.line_total, inv.currency)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
        <div class="totals">
          <table>
            ${inv.subtotal != null ? `<tr><td>Subtotal</td><td>${money(inv.subtotal, inv.currency)}</td></tr>` : ''}
            ${inv.discount ? `<tr><td>Discount${inv.coupon_code ? ' (' + esc(inv.coupon_code) + ')' : ''}</td><td class="disc">− ${money(inv.discount, inv.currency)}</td></tr>` : ''}
            ${inv.wallet_applied ? `<tr><td>Wallet applied</td><td class="disc">− ${money(inv.wallet_applied, inv.currency)}</td></tr>` : ''}
            <tr class="grand"><td>Total paid</td><td>${money(inv.total, inv.currency)}</td></tr>
          </table>
        </div>
        <div class="notes">
          ${s.notes ? `<p>${esc(s.notes)}</p>` : ''}
          ${inv.payment_note ? `<p>Payment note: ${esc(inv.payment_note)}</p>` : ''}
          <p class="receipt-note">This is a purchase receipt for order #${esc(inv.order_id)}.</p>
        </div>
      </div>`;
    })
    .catch((e) => { root.innerHTML = '<div class="error">' + esc(e.message) + '</div>'; });
})();
</script>
</body>
</html>
