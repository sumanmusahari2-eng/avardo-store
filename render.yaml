# Render Blueprint for GameRefill (free tier).
# Usage: push this repo to GitHub, then in Render: New -> Blueprint -> connect repo.
# Paste your Neon Postgres connection string into DATABASE_URL when prompted.
# JWT_SECRET is auto-generated by Render on first deploy.
services:
  - type: web
    name: gamerefill
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/settings/public
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # paste the Neon Postgres connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false # optional: enables the "Continue with Google" button
      - key: XTRA_USER_TOKEN
        sync: false # XtraGateway merchant token; enables the "Pay online" button
      - key: XTRA_BASE_URL
        value: https://xtragateway.site
      - key: PUBLIC_BASE_URL
        value: https://www.mlbbstore.in
